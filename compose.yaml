services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB environment variable is not set}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is not set}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER environment variable is not set}'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # The containerized app. Behind a profile so `bootRun` (Spring's Compose support) does not start
  # it alongside the app you are running from Gradle. Start with:
  #   docker compose --profile app up --build
  app:
    profiles: ['app']
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD}'
      SPOTIFY_CLIENT_ID: '${SPOTIFY_CLIENT_ID:?SPOTIFY_CLIENT_ID environment variable is not set}'
      SPOTIFY_CLIENT_SECRET: '${SPOTIFY_CLIENT_SECRET:?SPOTIFY_CLIENT_SECRET environment variable is not set}'
    ports:
      - '${APP_PORT:-8080}:8080'
    restart: unless-stopped
